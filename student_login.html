<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Smart Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; width: 100%; max-width: 400px; text-align: center; }
        h2 { margin-bottom: 20px; color: #1a202c; font-weight: 700; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .btn { background-color: #319795; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .btn:hover { background-color: #2c7a7b; }
        .alert { color: #e53e3e; font-size: 0.85rem; margin-bottom: 15px; background: #fed7d7; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🎓 Student Portal</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="roll_no" placeholder="Enter Roll Number (e.g., MCA2529)" required>
            <button type="submit" class="btn">Access Portal</button>
        </form>
        <p style="margin-top: 20px; font-size: 0.85rem;"><a href="{{ url_for('index') }}" style="color: #718096; text-decoration: none;">← Back to Home</a></p>
    </div>
</body>
</html>
