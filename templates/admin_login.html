<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Secure Dual-Biometric System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.75rem;
            color: #1a202c;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .login-card .subtitle {
            font-size: 0.92rem;
            color: #718096;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #4a5568;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #f8fafc;
            box-sizing: border-box;
        }
        .form-control:focus {
            border-color: #3182ce;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        .btn-submit {
            background-color: #319795;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #2c7a7b;
        }
        .error-msg {
            color: #e53e3e;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .btn-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .btn-back:hover {
            color: #4a5568;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Admin Access</h1>
        <p class="subtitle">Enter staff passcode to access control dashboard</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="passcode">Staff Passcode</label>
                <!-- Type changed to password so characters are hidden with dots -->
                <input type="password" id="passcode" name="passcode" required placeholder="Enter passcode" class="form-control">
            </div>

            <button type="submit" class="btn-submit">Login to Dashboard</button>
        </form>

        <a href="{{ url_for('index') }}" class="btn-back">← Back to Home</a>
    </div>
</body>
</html>
