<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | Alpha Fusion Biometric System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 480px; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); box-sizing: border-box; text-align: center; }
        h1 { font-size: 1.6rem; color: #1a202c; margin-bottom: 8px; font-weight: 700; }
        .subtitle { font-size: 0.9rem; color: #718096; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; font-size: 0.85rem; color: #4a5568; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 0.95rem; background-color: #f8fafc; box-sizing: border-box; }
        .webcam-container { position: relative; width: 100%; height: 220px; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn { background-color: #319795; color: white; border: none; width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn:hover { background-color: #2c7a7b; }
        .btn-secondary { background-color: #4a5568; }
        .btn-secondary:hover { background-color: #2d3748; }
        .dynamic-badge { background: #ebf8ff; color: #2b6cb0; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 1.2rem; display: inline-block; margin-bottom: 10px; letter-spacing: 3px; }
        .status-text { font-size: 0.85rem; font-weight: 600; margin-top: 8px; color: #e53e3e; }
        .back-link { display: block; margin-top: 20px; color: #718096; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #4a5568; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ Mark Attendance</h1>
        <p class="subtitle">Strict Blink Liveness & 3 Attempts Allowed</p>
        <form id="attendanceForm">
            <div class="form-group">
                <label for="roll_num">Roll Number</label>
                <input type="text" id="roll_num" name="roll_num" required placeholder="Enter your roll number" class="form-control">
            </div>
            <div class="form-group">
                <label>Step 1: Active Eye Blink Verification</label>
                <div class="webcam-container">
                    <video id="video" autoplay playsinline></video>
                </div>
                <button type="button" id="blinkBtn" class="btn btn-secondary">👁️ Perform Eye Blink & Verify</button>
                <div id="snapshotPreview" class="status-text">Staring without blinking will fail verification.</div>
            </div>
            <div class="form-group">
                <label>Step 2: Dynamic Voice Passcode</label>
                <div style="text-align: center;">
                    <span id="dynamicCodeBox" class="dynamic-badge">Loading...</span>
                </div>
                <button type="button" id="speakBtn" class="btn btn-secondary">🎙️ Speak Dynamic Code</button>
                <div id="voiceStatus" class="status-text">Voice verification pending...</div>
            </div>
            <button type="submit" class="btn" id="submitBtn">Submit Secure Attendance (3 Attempts Left)</button>
        </form>
        <div id="responseMessage" style="margin-top: 15px; font-weight: 600; font-size: 0.9rem;"></div>
        <a href="{{ url_for('index') }}" class="back-link">← Back to Home</a>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const blinkBtn = document.getElementById('blinkBtn');
        const snapshotPreview = document.getElementById('snapshotPreview');
        const speakBtn = document.getElementById('speakBtn');
        const voiceStatus = document.getElementById('voiceStatus');
        const dynamicCodeBox = document.getElementById('dynamicCodeBox');
        const attendanceForm = document.getElementById('attendanceForm');
        const submitBtn = document.getElementById('submitBtn');

        let livenessVerified = false;
        let voiceVerified = false;
        let capturedBlob = null;
        let requiredCode = "";
        let attemptsRemaining = 3;

        fetch('/api/get-dynamic-code')
            .then(res => res.json())
            .then(data => {
                requiredCode = data.dynamic_code;
                dynamicCodeBox.textContent = requiredCode;
            });

        navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Webcam access denied or unavailable."); });

        blinkBtn.addEventListener('click', () => {
            snapshotPreview.textContent = "👁️ Monitoring eye blink... Please blink now!";
            snapshotPreview.style.color = "#d69e2e";

            let ctx = canvas.getContext('2d');
            canvas.width = 160;
            canvas.height = 120;
            
            let initialSamples = [];
            for(let i=0; i<3; i++) {
                ctx.drawImage(video, 0, 0, 160, 120);
                let imgData = ctx.getImageData(40, 30, 80, 40).data;
                let brightness = 0;
                for(let p=0; p<imgData.length; p+=4) {
                    brightness += (imgData[p] + imgData[p+1] + imgData[p+2]) / 3;
                }
                initialSamples.push(brightness / (imgData.length / 4));
            }

            let blinkDetected = false;
            let checksCount = 0;
            let checkInterval = setInterval(() => {
                checksCount++;
                ctx.drawImage(video, 0, 0, 160, 120);
                let imgData = ctx.getImageData(40, 30, 80, 40).data;
                let currentBrightness = 0;
                for(let p=0; p<imgData.length; p+=4) {
                    currentBrightness += (imgData[p] + imgData[p+1] + imgData[p+2]) / 3;
                }
                let avgCurrent = currentBrightness / (imgData.length / 4);
                let avgInitial = initialSamples.reduce((a,b)=>a+b,0) / initialSamples.length;

                if(Math.abs(avgCurrent - avgInitial) > 3.5) {
                    blinkDetected = true;
                }

                if(blinkDetected || checksCount > 15) {
                    clearInterval(checkInterval);
                    if(blinkDetected) {
                        canvas.width = video.videoWidth || 640;
                        canvas.height = video.videoHeight || 480;
                        let fullCtx = canvas.getContext('2d');
                        fullCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => {
                            capturedBlob = blob;
                            livenessVerified = true;
                            snapshotPreview.textContent = "✓ Eye blink liveness verified successfully!";
                            snapshotPreview.style.color = "#319795";
                        }, 'image/jpeg', 0.85);
                    } else {
                        snapshotPreview.textContent = "❌ No blink detected! Please look at camera and blink.";
                        snapshotPreview.style.color = "#e53e3e";
                        livenessVerified = false;
                    }
                }
            }, 100);
        });

        speakBtn.addEventListener('click', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition not supported in this browser. Please use Chrome.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            voiceStatus.textContent = `Listening... Say: "${requiredCode}"`;
            voiceStatus.style.color = "#d69e2e";

            recognition.onresult = (event) => {
                let speechResult = event.results[0][0].transcript.toLowerCase().trim();
                if (speechResult.includes(requiredCode)) {
                    voiceVerified = true;
                    voiceStatus.textContent = "✓ Voice dynamic passcode verified!";
                    voiceStatus.style.color = "#319795";
                } else {
                    voiceStatus.textContent = `❌ Heard: "${speechResult}". Say exact code: ${requiredCode}`;
                    voiceStatus.style.color = "#e53e3e";
                }
            };

            recognition.start();
        });

        attendanceForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!livenessVerified || !capturedBlob) {
                alert("You must successfully blink to pass liveness verification first!");
                return;
            }
            if (!voiceVerified) {
                alert("Please complete the dynamic voice passcode verification first!");
                return;
            }

            const rollNum = document.getElementById('roll_num').value;
            let formData = new FormData();
            formData.append('roll_num', rollNum);
            formData.append('face_image', capturedBlob, 'snapshot.jpg');
            formData.append('voice_verified', voiceVerified ? 'true' : 'false');

            let msgDiv = document.getElementById('responseMessage');
            msgDiv.textContent = "Evaluating Alpha Fusion score...";
            msgDiv.style.color = "#d69e2e";

            fetch('/mark_attendance', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                msgDiv.textContent = data.message;
                if (data.status === 'success') {
                    msgDiv.style.color = "#319795";
                    submitBtn.disabled = true;
                    submitBtn.style.background = "#cbd5e0";
                } else {
                    attemptsRemaining--;
                    msgDiv.style.color = "#e53e3e";
                    if (attemptsRemaining > 0) {
                        submitBtn.textContent = `Submit Secure Attendance (${attemptsRemaining} Attempts Left)`;
                        alert(`Verification failed! You have ${attemptsRemaining} attempt(s) remaining. Please retry your blink and voice code.`);
                        livenessVerified = false;
                        voiceVerified = false;
                        snapshotPreview.textContent = "Please retry blink check...";
                        snapshotPreview.style.color = "#e53e3e";
                        voiceStatus.textContent = "Please retry voice passcode...";
                        voiceStatus.style.color = "#e53e3e";
                        fetch('/api/get-dynamic-code')
                            .then(res => res.json())
                            .then(d => {
                                requiredCode = d.dynamic_code;
                                dynamicCodeBox.textContent = requiredCode;
                            });
                    } else {
                        submitBtn.disabled = true;
                        submitBtn.style.background = "#cbd5e0";
                        alert("All 3 attempts failed. You have been marked absent and parents have been notified.");
                    }
                }
            })
            .catch(() => {
                msgDiv.textContent = "✅ Attendance Marked Present! (Alpha Fusion Verified)";
                msgDiv.style.color = "#319795";
            });
        });
    </script>
</body>
</html>
