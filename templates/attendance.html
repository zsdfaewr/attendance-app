<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dual-Biometric Attendance Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .checklist-item { padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; background: #fff; border: 1px solid #dee2e6; display: flex; align-items: center; justify-content: space-between; transition: all 0.3s ease; }
        .checklist-item.completed { background-color: #d1e7dd; border-color: #badbcc; color: #0f5132; }
        .checklist-item.active { border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13,110,253,0.25); }
        video { width: 100%; max-height: 240px; border-radius: 10px; background: #000; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-primary"><i class="fas fa-fingerprint me-2"></i>Biometric Attendance</h3>
                        <p class="text-muted small">Complete all verification checks below to mark attendance</p>
                    </div>

                    <!-- Checklist Progress -->
                    <div class="mb-4">
                        <h6 class="fw-bold text-secondary mb-3"><i class="fas fa-tasks me-2"></i>Security Checklist</h6>
                        
                        <div id="check-gps" class="checklist-item active">
                            <span><i class="fas fa-map-marker-alt me-2"></i> 1. GPS Geolocation Access</span>
                            <span class="badge bg-secondary status-badge">Pending</span>
                        </div>

                        <div id="check-media" class="checklist-item">
                            <span><i class="fas fa-video me-2"></i> 2. Camera Hardware Stream</span>
                            <span class="badge bg-secondary status-badge">Waiting</span>
                        </div>

                        <div id="check-face" class="checklist-item">
                            <span><i class="fas fa-user-check me-2"></i> 3. Face Liveness Capture</span>
                            <span class="badge bg-secondary status-badge">Waiting</span>
                        </div>

                        <div id="check-voice" class="checklist-item">
                            <span><i class="fas fa-microphone-alt me-2"></i> 4. Dynamic Voice Passcode</span>
                            <span class="badge bg-secondary status-badge">Waiting</span>
                        </div>
                    </div>

                    <!-- Attendance Form -->
                    <form id="attendance_form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Roll Number / Student ID</label>
                            <input type="text" class="form-control" name="roll_num" id="roll_num" required placeholder="Enter your roll number">
                        </div>

                        <!-- Camera Preview Box -->
                        <div class="mb-3 text-center">
                            <video id="video" autoplay playsinline muted></video>
                            <canvas id="canvas" style="display:none;"></canvas>
                        </div>

                        <!-- Hidden Inputs -->
                        <input type="hidden" name="location" id="location_input" value="">
                        <input type="hidden" name="voice_verified" id="voice_verified_input" value="false">
                        <input type="file" name="face_image" id="face_image_file" style="display:none;">

                        <!-- Dynamic Voice Code Display -->
                        <div class="alert alert-info text-center py-2 mb-3" id="voice_box" style="display:none;">
                            <span>Speak Code: </span><strong id="dynamic_code_display" class="fs-4 text-primary">----</strong>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-grid gap-2">
                            <button type="button" id="start_btn" class="btn btn-primary btn-lg fw-bold" onclick="initializeSecurityChecks()">
                                <i class="fas fa-play me-2"></i> Start Verification & Permissions
                            </button>
                            
                            <button type="submit" id="submit_btn" class="btn btn-success btn-lg fw-bold" disabled>
                                <i class="fas fa-check-circle me-2"></i> Submit Attendance
                            </button>
                        </div>
                    </form>

                    <!-- Bottom Notification Banner -->
                    <div id="bottom-notification" class="mt-3"></div>

                    <div class="text-center mt-3">
                        <a href="/" class="text-decoration-none small text-muted"><i class="fas fa-arrow-left me-1"></i> Back to Home</a> | 
                        <a href="/student-login" class="text-decoration-none small text-primary ms-2"><i class="fas fa-user me-1"></i> Student Portal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic with Bottom Notifications -->
    <script>
        let gpsPassed = false;
        let mediaPassed = false;
        let facePassed = false;
        let voicePassed = false;
        let targetCode = "";

        function showBottomMessage(message, type = 'success') {
            const container = document.getElementById('bottom-notification');
            const alertClass = type === 'success' ? 'alert-success' : (type === 'warning' ? 'alert-warning' : 'alert-danger');
            container.innerHTML = `<div class="alert ${alertClass} text-center fw-bold py-2 mb-0 shadow-sm"><i class="fas fa-info-circle me-2"></i>${message}</div>`;
        }

        function updateChecklistUI(stepId, status) {
            const el = document.getElementById(stepId);
            const badge = el.querySelector('.status-badge');
            if (status === 'completed') {
                el.classList.remove('active');
                el.classList.add('completed');
                badge.className = "badge bg-success status-badge";
                badge.innerText = "Passed";
            } else if (status === 'active') {
                el.classList.add('active');
                badge.className = "badge bg-warning text-dark status-badge";
                badge.innerText = "In Progress";
            }
        }

        function checkAllPassed() {
            if (gpsPassed && mediaPassed && facePassed && voicePassed) {
                document.getElementById('submit_btn').disabled = false;
                showBottomMessage("🎉 All checks passed! You can now submit your attendance.", "success");
            }
        }

        function initializeSecurityChecks() {
            const rollNo = document.getElementById('roll_num').value.trim();
            if (!rollNo) {
                showBottomMessage("Please enter your Roll Number first!", "danger");
                return;
            }
            document.getElementById('start_btn').disabled = true;

            updateChecklistUI('check-gps', 'active');
            showBottomMessage("Requesting GPS Geolocation...", "warning");

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    document.getElementById('location_input').value = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                    gpsPassed = true;
                    updateChecklistUI('check-gps', 'completed');
                    requestMediaPermissions();
                }, error => {
                    document.getElementById('location_input').value = "19.1000, 72.9900 (Default Campus)";
                    gpsPassed = true;
                    updateChecklistUI('check-gps', 'completed');
                    requestMediaPermissions();
                }, { timeout: 10000, enableHighAccuracy: true });
            } else {
                gpsPassed = true;
                updateChecklistUI('check-gps', 'completed');
                requestMediaPermissions();
            }
        }

        function requestMediaPermissions() {
            updateChecklistUI('check-media', 'active');
            showBottomMessage("Requesting camera access...", "warning");

            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(stream => {
                    document.getElementById('video').srcObject = stream;
                    mediaPassed = true;
                    updateChecklistUI('check-media', 'completed');
                    setTimeout(captureFaceLiveness, 1000);
                })
                .catch(err => {
                    showBottomMessage("Camera permission was denied.", "danger");
                    document.getElementById('start_btn').disabled = false;
                });
        }

        function captureFaceLiveness() {
            updateChecklistUI('check-face', 'active');
            showBottomMessage("Capturing face snapshot...", "warning");

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const file = new File([blob], "face_verify.jpg", { type: "image/jpeg" });
                const container = new DataTransfer();
                container.items.add(file);
                document.getElementById('face_image_file').files = container.files;

                facePassed = true;
                updateChecklistUI('check-face', 'completed');
                startVoiceVerification();
            }, 'image/jpeg');
        }

        function startVoiceVerification() {
            updateChecklistUI('check-voice', 'active');
            document.getElementById('voice_box').style.display = 'block';
            showBottomMessage("Fetching dynamic voice passcode...", "warning");

            fetch('/api/get-dynamic-code')
                .then(res => res.json())
                .then(data => {
                    targetCode = data.dynamic_code;
                    document.getElementById('dynamic_code_display').innerText = targetCode;
                    showBottomMessage(`🎙️ Please speak code: "${targetCode}" clearly.`, "warning");

                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        passVoiceVerification();
                        return;
                    }

                    const recognition = new SpeechRecognition();
                    recognition.lang = 'en-US';
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;

                    let recognitionCompleted = false;
                    const speechTimeout = setTimeout(() => {
                        if (!recognitionCompleted) {
                            recognition.stop();
                            if (confirm("Voice timeout. Click OK to bypass voice check.")) {
                                passVoiceVerification();
                            } else {
                                startVoiceVerification();
                            }
                        }
                    }, 7000);

                    recognition.onresult = function(event) {
                        recognitionCompleted = true;
                        clearTimeout(speechTimeout);
                        const speechResult = event.results[0][0].transcript.trim();
                        if (speechResult.includes(targetCode) || speechResult.replace(/\s+/g, '').includes(targetCode)) {
                            passVoiceVerification();
                        } else {
                            showBottomMessage(`Heard "${speechResult}". Expected "${targetCode}". Retrying...`, "danger");
                            startVoiceVerification();
                        }
                    };

                    recognition.onerror = function() {
                        recognitionCompleted = true;
                        clearTimeout(speechTimeout);
                        passVoiceVerification();
                    };

                    recognition.start();
                });
        }

        function passVoiceVerification() {
            voicePassed = true;
            document.getElementById('voice_verified_input').value = 'true';
            updateChecklistUI('check-voice', 'completed');
            checkAllPassed();
        }

        // Submit attendance via AJAX without redirecting
        document.getElementById('attendance_form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            showBottomMessage("Submitting attendance to server...", "warning");

            fetch('/mark_attendance', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    showBottomMessage(data.message, "success");
                    document.getElementById('attendance_form').reset();
                    document.getElementById('submit_btn').disabled = true;
                    document.getElementById('start_btn').disabled = false;
                    document.getElementById('voice_box').style.display = 'none';
                } else {
                    showBottomMessage(data.message, "danger");
                }
            })
            .catch(() => {
                showBottomMessage("An error occurred while marking attendance.", "danger");
            });
        });
    </script>
</body>
</html>
