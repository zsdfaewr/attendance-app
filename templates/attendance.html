<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance | Alpha Fusion Biometric System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #ffffff; width: 100%; max-width: 480px; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); box-sizing: border-box; text-align: center; }
        h1 { font-size: 1.6rem; color: #1a202c; margin-bottom: 8px; font-weight: 700; }
        .subtitle { font-size: 0.9rem; color: #718096; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; font-size: 0.85rem; color: #4a5568; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 0.95rem; background-color: #f8fafc; box-sizing: border-box; }
        .webcam-container { position: relative; width: 100%; height: 220px; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn { background-color: #319795; color: white; border: none; width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn:hover { background-color: #2c7a7b; }
        .btn-secondary { background-color: #4a5568; }
        .btn-secondary:hover { background-color: #2d3748; }
        .status-text { font-size: 0.85rem; font-weight: 600; margin-top: 8px; color: #e53e3e; }
        .back-link { display: block; margin-top: 20px; color: #718096; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #4a5568; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ Mark Attendance</h1>
        <p class="subtitle">Alpha Fusion Engine (Face & Voice Passcode)</p>
        <form id="attendanceForm">
            <div class="form-group">
                <label for="roll_num">Roll Number</label>
                <input type="text" id="roll_num" name="roll_num" required placeholder="Enter your roll number" class="form-control">
            </div>
            <div class="form-group">
                <label>Face Liveness Check</label>
                <div class="webcam-container">
                    <video id="video" autoplay playsinline></video>
                </div>
                <button type="button" id="captureBtn" class="btn btn-secondary">📸 Verify Face Snapshot</button>
                <div id="snapshotPreview" class="status-text">Face verification pending...</div>
            </div>
            <div class="form-group">
                <label>Voice Passcode Verification</label>
                <button type="button" id="speakBtn" class="btn btn-secondary">🎙️ Speak Passcode ("secure attendance")</button>
                <div id="voiceStatus" class="status-text">Voice verification pending...</div>
            </div>
            <button type="submit" class="btn">Submit Dual-Biometric Attendance</button>
        </form>
        <div id="responseMessage" style="margin-top: 15px; font-weight: 600; font-size: 0.9rem;"></div>
        <a href="{{ url_for('index') }}" class="back-link">← Back to Home</a>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const snapshotPreview = document.getElementById('snapshotPreview');
        const speakBtn = document.getElementById('speakBtn');
        const voiceStatus = document.getElementById('voiceStatus');
        const attendanceForm = document.getElementById('attendanceForm');
        let livenessVerified = false;
        let voiceVerified = false;
        let capturedBlob = null;
        const REQUIRED_VOICE_CODE = "secure attendance";
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Webcam access denied or unavailable."); });
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            let context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob((blob) => {
                capturedBlob = blob;
                livenessVerified = true;
                snapshotPreview.textContent = "✓ Face liveness verified successfully!";
                snapshotPreview.style.color = "#319795";
            }, 'image/jpeg', 0.85);
        });
        speakBtn.addEventListener('click', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported in this browser. Try Google Chrome.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            voiceStatus.textContent = `Listening... Say passcode: "${REQUIRED_VOICE_CODE}"`;
            voiceStatus.style.color = "#d69e2e";
            recognition.onresult = (event) => {
                let speechResult = event.results[0][0].transcript.toLowerCase().trim();
                if (speechResult === REQUIRED_VOICE_CODE) {
                    voiceVerified = true;
                    voiceStatus.textContent = "✓ Voice passcode verified successfully!";
                    voiceStatus.style.color = "#319795";
                } else {
                    voiceStatus.textContent = `❌ Incorrect: "${speechResult}". Try again.`;
                    voiceStatus.style.color = "#e53e3e";
                }
            };
            recognition.onerror = () => {
                voiceStatus.textContent = "Voice recognition error. Please try again.";
                voiceStatus.style.color = "#e53e3e";
            };
            recognition.start();
        });
        attendanceForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!livenessVerified || !capturedBlob) {
                alert("Please verify your face snapshot first!");
                return;
            }
            if (!voiceVerified) {
                alert("Please complete voice passcode verification first!");
                return;
            }
            const rollNum = document.getElementById('roll_num').value;
            let formData = new FormData();
            formData.append('roll_num', rollNum);
            formData.append('face_image', capturedBlob, 'snapshot.jpg');
            formData.append('voice_verified', voiceVerified ? 'true' : 'false');
            fetch('/mark_attendance', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                let msgDiv = document.getElementById('responseMessage');
                msgDiv.textContent = data.message;
                msgDiv.style.color = data.status === 'success' ? '#319795' : '#e53e3e';
            })
            .catch(err => {
                alert("An error occurred while submitting attendance.");
            });
        });
    </script>
</body>
</html>
