<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dual-Biometric Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 20px; color: #1a202c; }
        .hero-card { background: #ffffff; width: 100%; max-width: 600px; padding: 50px 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); text-align: center; box-sizing: border-box; }
        .hero-card h1 { font-size: 2rem; color: #1a202c; margin-bottom: 12px; font-weight: 700; }
        .hero-card p { font-size: 1rem; color: #718096; margin-bottom: 35px; line-height: 1.5; }
        .button-group { display: flex; flex-direction: column; gap: 15px; }
        .btn { display: block; width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 8px; text-decoration: none; cursor: pointer; transition: all 0.2s ease; box-sizing: border-box; }
        .btn-primary { background-color: #319795; color: white; }
        .btn-primary:hover { background-color: #2c7a7b; }
        .btn-secondary { background-color: #2b6cb0; color: white; }
        .btn-secondary:hover { background-color: #2c5282; }
        .btn-outline { background-color: #edf2f7; color: #4a5568; border: 1px solid #cbd5e0; }
        .btn-outline:hover { background-color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="hero-card">
        <h1>🔐 Dual-Biometric Attendance System</h1>
        <p>Secure face liveness verification and voice passcode matching for modern attendance tracking.</p>

        <div class="button-group">
            <!-- Corrected route name matching app.py -->
            <a href="{{ url_for('register') }}" class="btn btn-primary">✨ New Student Registration</a>
            <a href="{{ url_for('student_login') }}" class="btn btn-secondary">🎓 Student Portal Login</a>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">📊 Admin Dashboard</a>
        </div>
    </div>
</body>
</html>
