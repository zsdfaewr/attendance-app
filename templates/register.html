
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Biometric Attendance</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #1a202c;
        }

        .hero-card {
            background: #fff;
            width: 100%;
            max-width: 600px;
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #1a202c;
        }

        .subtitle {
            font-size: 1rem;
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background: #319795;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2c7a7b;
        }

        .btn-secondary {
            background: #2b6cb0;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #2c5282;
        }

        .btn-outline {
            background: #edf2f7;
            color: #4a5568;
            border: 1px solid #cbd5e0;
        }

        .btn-outline:hover {
            background: #e2e8f0;
        }

        @media (max-width: 480px) {
            .hero-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <main class="hero-card">
        <h1>🔐 Dual-Biometric Attendance System</h1>

        <p class="subtitle">
            Student registration, face verification,
            voice passcode verification and attendance tracking.
        </p>

        <nav class="button-group">
            <!-- FIXED: endpoint is register_page -->
            <a href="{{ url_for('register_page') }}"
               class="btn btn-primary">
                ✨ New Student Registration
            </a>

            <a href="{{ url_for('student_login') }}"
               class="btn btn-secondary">
                🎓 Student Portal Login
            </a>

            <a href="{{ url_for('admin_dashboard') }}"
               class="btn btn-outline">
                📊 Admin Dashboard
            </a>

            <a href="{{ url_for('index') }}"
               class="btn btn-outline">
                ← Back to Home
            </a>
        </nav>
    </main>
</body>
</html>
