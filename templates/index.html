<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dual-Biometric Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .portal-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            box-sizing: border-box;
        }
        .portal-card h1 {
            font-size: 1.85rem;
            color: #1a202c;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .portal-card .subtitle {
            font-size: 0.95rem;
            color: #718096;
            margin-bottom: 35px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: #319795;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2c7a7b;
        }
        .btn-secondary {
            background-color: #2b6cb0;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #2c5282;
        }
        .btn-outline {
            background-color: #edf2f7;
            color: #4a5568;
            border: 1px solid #cbd5e0;
        }
        .btn-outline:hover {
            background-color: #e2e8f0;
            color: #2d3748;
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <h1>🔐 Secure Biometric Portal</h1>
        <p class="subtitle">Face Liveness & Voice Passcode Verification System</p>

        <div class="nav-links">
            <a href="{{ url_for('register_page') }}" class="btn btn-primary">📝 New Student Registration</a>
            <a href="{{ url_for('attendance_page') }}" class="btn btn-secondary">✅ Mark Attendance</a>
            <a href="{{ url_for('admin_login') }}" class="btn btn-outline">📊 Admin Dashboard Login</a>
        </div>
    </div>
</body>
</html>
