<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login | Dual-Biometric System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: #ffffff; width: 100%; max-width: 400px; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); box-sizing: border-box; text-align: center; }
        .login-card h1 { font-size: 1.75rem; color: #1a202c; margin-bottom: 8px; font-weight: 700; }
        .login-card .subtitle { font-size: 0.92rem; color: #718096; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; font-size: 0.9rem; color: #4a5568; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1rem; background-color: #f8fafc; box-sizing: border-box; }
        .btn-submit { background-color: #2b6cb0; color: white; border: none; width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .btn-submit:hover { background-color: #2c5282; }
        .error-msg { color: #e53e3e; font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; }
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #718096; text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .btn-back:hover { color: #4a5568; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🎓 Student Portal</h1>
        <p class="subtitle">Enter your roll number to view attendance record</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="error-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label for="roll_no">Roll Number</label>
                <input type="text" id="roll_no" name="roll_no" required placeholder="Enter roll number" class="form-control">
            </div>
            <button type="submit" class="btn-submit">View Attendance Portal</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn-back">← Back to Home</a>
    </div>
</body>
</html>
